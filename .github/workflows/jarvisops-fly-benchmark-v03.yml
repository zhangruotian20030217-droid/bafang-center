name: JarvisOps Fly Reservoir Benchmark v0.3
on:
  push:
    branches: [jarvisops-fly-benchmark-v03]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLY_DATA: /home/runner/fly-data
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache MaleCNS prebuilt brain
        uses: actions/cache@v4
        with:
          path: /home/runner/fly-data
          key: flybrain-malecns-v1-prebuilt
      - name: Install flybrain
        run: python -m pip install --upgrade pip && pip install flybrain==0.1.0
      - name: Download MaleCNS
        run: flybrain download
      - name: Verify brain files
        run: |
          flybrain info
          test -s "$FLY_DATA/brain.npz"
          test -s "$FLY_DATA/weights.npz"
          sha256sum "$FLY_DATA/brain.npz" "$FLY_DATA/weights.npz"
      - name: Run 24-incident benchmark
        run: python benchmark_runner.py
      - name: Upload benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: jarvisops-fly-benchmark-result-v03
          path: benchmark_result.json
          if-no-files-found: error
